<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#0D1F1A"/>
      <stop offset="70%" stop-color="#080C0B"/>
      <stop offset="100%" stop-color="#080C0B"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#4ECCA3" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#4ECCA3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ECCA3" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4ECCA3" stop-opacity="1"/>
    </linearGradient>
    <filter id="text-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="curve-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="cb"/>
      <feMerge>
        <feMergeNode in="cb"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded iOS-style square: 22% of 512 ≈ 113 -->
  <rect width="512" height="512" rx="113" fill="url(#bg)"/>
  <rect width="512" height="512" rx="113" fill="url(#halo)"/>

  <!-- Ascending teal curve behind the T (bottom-left to top-right) -->
  <path d="M 70 420 C 170 380, 240 330, 320 250 S 440 130, 470 110"
        fill="none" stroke="url(#curve)" stroke-width="5"
        stroke-linecap="round" filter="url(#curve-glow)"/>
  <circle cx="470" cy="110" r="11" fill="#4ECCA3" opacity="0.25"/>
  <circle cx="470" cy="110" r="6" fill="#4ECCA3" filter="url(#curve-glow)"/>

  <!-- Fraunces-like serif "T" (Georgia fallback for PNG rendering) -->
  <text x="256" y="340" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="330" font-weight="300" fill="#4ECCA3"
        filter="url(#text-glow)" letter-spacing="-6">T</text>
</svg>
