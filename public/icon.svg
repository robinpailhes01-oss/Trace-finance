<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4ECCA3" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#4ECCA3" stop-opacity="0"/>
    </radialGradient>
    <filter id="text-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="curve-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="cb"/>
      <feMerge>
        <feMergeNode in="cb"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>

  <!-- Serif "T" -->
  <text x="256" y="320" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="300" font-weight="400" fill="#F0EDE8"
        filter="url(#text-glow)" letter-spacing="-8">T</text>

  <!-- Ascending teal curve below the T -->
  <path d="M 96 400 Q 192 380 256 360 T 416 280"
        fill="none" stroke="#4ECCA3" stroke-width="6"
        stroke-linecap="round" filter="url(#curve-glow)"/>

  <!-- Bright dot at the end of the curve -->
  <circle cx="416" cy="280" r="10" fill="#4ECCA3" opacity="0.25"/>
  <circle cx="416" cy="280" r="5" fill="#4ECCA3" filter="url(#curve-glow)"/>
</svg>
